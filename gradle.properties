org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official

# A default that is a snapshot on purpose: a build with no -PVERSION must not produce something that
# looks like a release.
version=0.1.0-SNAPSHOT

# What this repository tells the shared conventions.
sborka.group=io.github.youndie.kontainer
sborka.repository=youndie/kontainer
sborka.description=Containers for Kotlin/Native tests: fixtures from compose files, readiness by protocol, faults mid-test.
sborka.inceptionYear=2026
sborka.jvmToolchain=25

# v1 is linuxX64 only (research D2), and KGP disables `linuxX64Test` on a Mac by itself; the tests
# run on the Linux build box.
kotlin.native.ignoreDisabledTargets=true
